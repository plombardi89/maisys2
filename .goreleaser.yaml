version: 2

project_name: maisys

builds:
  - id: maisys
    main: ./cmd/maisys
    binary: maisys
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows is amd64 only (see #1).
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/plombardi89/maisys2/internal/buildinfo.version={{ .Version }}
      - -X github.com/plombardi89/maisys2/internal/buildinfo.commit={{ .ShortCommit }}
      - -X github.com/plombardi89/maisys2/internal/buildinfo.date={{ .Date }}
      # Self-update installs releases from the repo that built this one, so a
      # fork's release workflow builds binaries that update from the fork.
      - -X github.com/plombardi89/maisys2/internal/buildinfo.updateRepo={{ envOrDefault "GITHUB_REPOSITORY" "plombardi89/maisys2" }}

archives:
  - id: maisys
    name_template: "maisys_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./install.sh
    - glob: ./docs/modules.md
      name_template: modules.md
    - glob: ./schema/config.schema.json
      name_template: config.schema.json

# Releases are created as drafts. The release workflow publishes them only
# after every test has passed against the draft's files, so self-update
# (which follows releases/latest) never sees an untested release.
release:
  draft: true
  replace_existing_draft: true
  extra_files:
    - glob: ./install.sh
    # Generated by go generate; CI checks they're up to date.
    - glob: ./docs/modules.md
      name_template: modules.md
    - glob: ./schema/config.schema.json
      name_template: config.schema.json

changelog:
  use: github
  sort: asc
