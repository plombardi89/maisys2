version: "2"

linters:
  default: standard
  enable:
    # Bugs and correctness.
    - bodyclose
    - canonicalheader
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - makezero
    - nilerr
    - nilnil
    - noctx
    - recvcheck
    - usetesting
    - wastedassign
    # Style and clarity.
    - dupword
    - errname
    - exptostd
    - gocritic
    - intrange
    - mirror
    - misspell
    - modernize
    - nolintlint
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      # A switch with a default case already handles every other value.
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/plombardi89/maisys2
