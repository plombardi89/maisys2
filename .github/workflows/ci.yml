name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Check shell scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test (with race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

  # GitHub has no Fedora runners, so these run in Fedora's official images.
  test-fedora:
    name: test (fedora-${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ["43", "44", "45"]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.version }}
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False git-core tar gzip gcc
      - uses: actions/checkout@v7
      # The container runs as root but the checkout belongs to the runner's
      # user, so git (and Go's VCS stamping) would refuse the repo.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test (with race detector)
        run: go test -race ./...

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # The install tests use a fake release, so check that install.sh also
      # works with the archives and checksums GoReleaser really produces.
      - name: Install the snapshot with install.sh
        run: |
          MAISYS_RELEASE_URL="file://$PWD/dist" bash -s -- <install.sh
          ~/.local/bin/maisys --version
