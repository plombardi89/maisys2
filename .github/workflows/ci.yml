name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # docs/modules.md, schema/config.schema.json and
      # internal/modules/docs_gen.go come from the module config structs.
      - name: Check generated files are up to date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'make generate' and commit the result." >&2
            git status --porcelain
            git diff
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # Files built only for Windows (named *_windows.go) aren't part of the
      # Linux build, so lint the Windows build too.
      - name: Lint the Windows build
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.15.0
      # shellcheck, shfmt and actionlint at the versions pinned in the
      # Makefile, the same ones make lint uses locally.
      - name: Cache lint tools
        uses: actions/cache@v6
        with:
          path: bin
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Lint shell scripts and workflows
        run: make lint-shell lint-workflows

  # PSScriptAnalyzer on install.ps1, in the Windows PowerShell 5.1 a fresh
  # Windows 11 has, with the settings in PSScriptAnalyzerSettings.psd1, which
  # also check that the script works in Windows PowerShell 5.1.
  lint-powershell:
    runs-on: windows-latest
    env:
      PSSCRIPTANALYZER_VERSION: 1.25.0
    steps:
      - uses: actions/checkout@v7
      - name: Lint install.ps1
        shell: powershell
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          Invoke-ScriptAnalyzer -Path install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1 -ReportSummary -EnableExit

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test (with race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
      # On Windows, this includes install.ps1's tests (test/install), which
      # run it with Windows PowerShell.
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

  # GitHub has no Fedora runners, so these run in Fedora's official images.
  test-fedora:
    name: test (fedora-${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ["43", "44", "45"]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.version }}
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False git-core tar gzip gcc
      - uses: actions/checkout@v7
      # The container runs as root but the checkout belongs to the runner's
      # user, so git (and Go's VCS stamping) would refuse the repo.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test (with race detector)
        run: go test -race ./...

  # Real syncs of the fixture's test machines (test/fixture) in systemd
  # containers, one job for each distro (test/e2e). The distros follow the
  # support policy, like the unit tests', and test/e2e checks that they're
  # fixture.Distros.
  e2e:
    name: e2e (${{ matrix.distro }}${{ endsWith(matrix.runner, '-arm') && ', arm64' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora-43
            runner: ubuntu-latest
          - distro: fedora-44
            runner: ubuntu-latest
          - distro: fedora-45
            runner: ubuntu-latest
          - distro: ubuntu-24.04
            runner: ubuntu-latest
          - distro: ubuntu-26.04
            runner: ubuntu-latest
          # arm64 only on the newest Ubuntu LTS release.
          - distro: ubuntu-26.04
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          sudo podman version
      # Rootful podman: systemd containers are more reliable that way on the
      # hosted runners than rootless ones, which need systemd's cgroup
      # delegation for the runner's user.
      - name: Run the end-to-end tests
        run: make e2e DISTRO="$DISTRO"
        env:
          DISTRO: ${{ matrix.distro }}
          PODMAN: sudo podman

  # The private config repo sign-in test (test/signin): maisys clones a
  # private copy of the fixture over HTTPS, with the token in
  # MAISYS_CONFIG_TOKEN and with the token typed at its prompt. It needs the
  # repo secret MAISYS_FIXTURE_TOKEN, which pull requests from forks don't
  # get, so it only runs on pushes to main. Its syncs are dry runs in home
  # folders of their own, so it runs on the runner itself. Until the secret
  # and the repo variable MAISYS_FIXTURE_URL are set up, it only says so.
  signin:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the private fixture repo is set up
        id: setup
        env:
          MAISYS_FIXTURE_URL: ${{ vars.MAISYS_FIXTURE_URL }}
          MAISYS_FIXTURE_TOKEN: ${{ secrets.MAISYS_FIXTURE_TOKEN }}
        run: |
          if [ -n "$MAISYS_FIXTURE_URL" ] && [ -n "$MAISYS_FIXTURE_TOKEN" ]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >>"$GITHUB_OUTPUT"
          echo "::notice title=Sign-in test not run::The private config repo sign-in test needs a private copy of the fixture (go run ./test/cmd/fixture DIR, then push it to a new private repo), the repo variable MAISYS_FIXTURE_URL set to its HTTPS clone URL, and the repo secret MAISYS_FIXTURE_TOKEN set to a fine-grained token with read-only Contents access to that repo alone."
      # The checkout's token isn't kept, so git can't sign in with it.
      - uses: actions/checkout@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          go-version-file: go.mod
      - name: Sign in to the private fixture repo
        if: steps.setup.outputs.ready == 'true'
        run: make signin-test
        env:
          MAISYS_FIXTURE_URL: ${{ vars.MAISYS_FIXTURE_URL }}
          MAISYS_FIXTURE_TOKEN: ${{ secrets.MAISYS_FIXTURE_TOKEN }}

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # The install tests use a fake release, so check that install.sh also
      # works with the archives and checksums GoReleaser really produces.
      - name: Install the snapshot with install.sh
        run: |
          MAISYS_RELEASE_URL="file://$PWD/dist" bash -s -- <install.sh
          ~/.local/bin/maisys --version
      # Likewise for self-update: an older maisys should update itself to the
      # snapshot and restart. Snapshot versions are <last tag>-SNAPSHOT-<commit>
      # (0.0.0-SNAPSHOT-<commit> before the first tag), so the older build is
      # 0.0.0-0, which sorts before any of them, and the expected version comes
      # from GoReleaser's metadata. maisys isn't set up there, so the sync
      # then fails; that's fine.
      - name: Self-update to the snapshot
        run: |
          version=$(jq -r .version dist/metadata.json)
          echo "snapshot version: $version"
          go build -o old/maisys -ldflags "-X github.com/plombardi89/maisys2/internal/buildinfo.version=0.0.0-0" ./cmd/maisys
          MAISYS_RELEASE_URL="file://$PWD/dist" ./old/maisys sync --dry-run >sync.log 2>&1 || true
          cat sync.log
          grep -qF "updated from 0.0.0-0 to $version;" sync.log
          ./old/maisys --version | tee version.txt
          grep -qF "maisys $version " version.txt
