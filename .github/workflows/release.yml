name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Jobs that test the draft's files run here, and publish waits for all of
  # them. The others (Linux end-to-end, Windows integration and the Windows
  # 11 VM) are added as they're built.

  # The upgrade test (TestUpgrade in test/e2e), in a systemd container for
  # each distro: the latest published release, which is the previous one
  # until publish runs (releases/latest never includes drafts), is installed
  # with its own install.sh and syncs the fixture. Then it updates itself to
  # the draft's files, through MAISYS_RELEASE_URL, and syncs again, after
  # which a dry run must find nothing to change.
  upgrade:
    name: upgrade (${{ matrix.distro }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-44, ubuntu-26.04]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # The GITHUB_TOKEN only sees draft releases with write access.
      contents: write
    steps:
      # All the tags: the test syncs the fixture from the previous release's
      # tag. The token isn't kept for the test's steps.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          sudo podman version
      - name: Download the draft release's files
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Rootful podman, as in CI's e2e job.
      - name: Run the upgrade test
        run: make upgrade-test DISTRO="$DISTRO" DRAFT=draft PREVIOUS="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
        env:
          DISTRO: ${{ matrix.distro }}
          PODMAN: sudo podman

  publish:
    needs: [draft, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
